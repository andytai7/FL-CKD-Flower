[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ckd-fl"
version = "1.0.0"
description = "FLIP-IT pre-kickoff baseline: federated CKD risk models with Flower.ai"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andy Tai" }]
keywords = ["federated-learning", "healthcare", "ckd", "flower"]

# Lightweight, torch-free stack: logistic regression only (sklearn SGDClassifier).
# flwr pinned to the 1.33 line — the Message API (`@app.train()` / `ArrayRecord` / `Grid`) and the
# `flwr.serverapp.strategy` namespace. This is the version the SuperLink/SuperNode deployment,
# SecAgg+ and Differential Privacy documentation targets, and the one this project deploys against
# (see docs/DEPLOYMENT.md). Federation *connection* config lives in ~/.flwr/config.toml from 1.30+;
# run *defaults* still live here under [tool.flwr.app.config].
# The single model is Flower-federatable (project rule, CLAUDE.md §0): FedAvg / FedProx / FedMosaic
# are aggregation protocols over the logistic-regression parameters.
dependencies = [
    "flwr[simulation]>=1.33,<1.34",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "dp-accounting>=0.6.0",
    # Helios SQL-on-FHIR engine (HeliosSoftware/hfs): the "our query is SQL on FHIR" mechanism
    # that runs the ViewDefinitions over Helios-hosted resources (data/helios.py `sql`).
    "pysof>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
# Everything needed to open and run notebooks/ in VS Code or Jupyter, plus headless execution.
notebook = [
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "nbconvert>=7.0.0",
    "jupyterlab>=4.0.0",
]

[project.scripts]
# Ray-free local federated simulation (works on paths with spaces). Run: uv run ckd-simulate
ckd-simulate = "simulate:main"
# Centralized "ceiling" baseline (non-federated reference). Run: uv run ckd-baseline
ckd-baseline = "centralized:main"
# Generate synthetic per-clinic datasets (the FLIP-IT federation). Run: uv run ckd-clinics
ckd-clinics = "data.synthesize:main"
# Full protocol benchmark -> results/benchmark.json. Run: uv run ckd-benchmark
ckd-benchmark = "benchmark:main"
# Privacy layer measurement -> results/privacy.json. Run: uv run ckd-privacy
ckd-privacy = "privacy:main"
# Membership-inference leakage audit (T2.5 / privacy layer L6). Run: uv run ckd-audit
ckd-audit = "audit:main"
# Era 14 (docs/ERAS.md): equity-priced privacy orchestration -> results/equity.json
# Run: uv run ckd-equity   (smoke: uv run ckd-equity --quick)
ckd-equity = "equity:main"
# Era 15 (docs/ERAS.md): census-spread phase map for privacy orchestration -> results/phasemap.json
# Run: uv run ckd-phasemap   (smoke: uv run ckd-phasemap --quick)
ckd-phasemap = "phasemap:main"
# Practice-side FHIR preprocessor rehearsal: canonical extract_features.sql frame from one
# practice's Helios FHIR server, de-identified. Run: uv run ckd-fhir-extract http://127.0.0.1:8080
ckd-fhir-extract = "data.fhir_loader:main"
# Helios FHIR server host + synthetic seed (doctrine CLAUDE.md §0.9: only build from Helios).
# Run: uv run ckd-helios [up|serve|seed|extract|sql]
ckd-helios = "data.helios:main"
# Train the federated global model and export it as JSON for the demo webapp.
# Run: uv run ckd-export-model
ckd-export-model = "model_artifact:main"
# Local physician demo: input patient details, get the federated model's risk score.
# Run: uv run ckd-web --port 9000   (8080 belongs to the Helios FHIR server; requires ckd-export-model)
ckd-web = "webapp:main"

# Flat layout: data/ and models/ packages plus top-level app modules at the repo root.
[tool.hatch.build.targets.wheel]
include = [
    "data", "models",
    "client_app.py", "server_app.py", "task.py", "centralized.py", "simulate.py",
    "messages.py", "benchmark.py", "privacy.py", "audit.py", "dp.py", "equity.py", "phasemap.py",
    "model_artifact.py", "webapp.py",
]
# Editable installs: put the project root on sys.path (path-based) rather than enumerating
# modules, so every top-level .py here is importable and newly added files are picked up reliably.
dev-mode-dirs = ["."]

# ── Flower App configuration ────────────────────────────────────────────────
# Run the federated simulation with:  uv run flwr run .
[tool.flwr.app]
publisher = "andytai"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10      # federation rounds. Reduced from 20: the logistic protocols are
                            # converged by ~round 10 (docs/REPORT.md), and every additional
                            # round composes additional privacy loss. Halving the rounds
                            # halves the composed epsilon at no measured accuracy cost.
fraction-fit = 1.0          # fraction of practices training per round
local-epochs = 2            # local partial_fit passes per round
num-practices = 12          # MUST equal options.num-supernodes below
alpha = 0.5                 # Dirichlet non-IID concentration (small=skewed, large=IID)
iid = false                 # set true for an IID even split
class-weight-balanced = true
seed = 42

# Where each SuperNode reads its patients from: "csv" partitions the flat synthetic file (the
# pre-migration evaluation baseline only), "fhir" queries that practice's Helios FHIR server
# (fhir-base-url comes from --node-config; sandbox host: uv run ckd-helios).
data-source = "csv"
# Note the two sources are different tasks (CLAUDE.md §3b): "csv" = synthetic 10-feature
# prevalence schema; "fhir" = canonical extract_features.sql contract, de-identified in
# data/fhir_loader.py (no identifier read or emitted; optional `pseudonym-salt` in --node-config
# adds the salted-HMAC join key named in docs/PRIVACY.md §2).

# Privacy layer L5 (docs/PRIVACY.md §1): anonymise per-practice metric lines / suppress small cohorts.
# ON by default. Naming a practice alongside its cohort size and AUROC every round is itself a
# disclosure to whoever reads the SuperLink logs, independently of the gradients. This is the
# DEPLOYMENT default; the research runners (ckd-simulate / ckd-benchmark) keep their own flags and
# still print the identified view, so baseline numbers stay interpretable.
metric-privacy = true
min-cohort-size = 20

# Participation floor: a practice whose local train split is smaller than `min-train-examples`
# is excluded from FedAvg. Enforced on both sides: the ClientApp skips training and replies with
# num-examples = 0 (a zero weight — under SecAgg+ this also zeroes the protocol's weighting
# factor, removing the practice from the masked sum), and the ServerApp's CohortFloorFedAvg
# strategy drops any reply below the floor before aggregating. 0 = off: every practice trains,
# keeping the research baseline comparable.
min-train-examples = 0

# Privacy layer L4-local (docs/PRIVACY.md §1): clip + Gaussian-noise each practice's update INSIDE the
# SuperNode, before transmission. This is the only mechanism that changes what the AGGREGATING PARTY
# receives — central DP noises during aggregation, so the server sees every un-noised update first.
# SEMANTICS: a PER-ROUND budget applied to every outgoing train message — the true cost over the
# run composes across all num-server-rounds (privacy.py does this conversion for the sweeps; e.g.
# per-round 2.0 over 20 rounds is a composed ε≈10 under this accountant, not 2.0). The sibling
# central-dp-epsilon / dpsgd-epsilon keys are COMPOSED targets. Applied to train replies only;
# evaluate replies and SecAgg+ control messages pass unchanged.
# 0 = off. Utility cost at this cohort size is severe; measure with `uv run ckd-privacy` first.
local-dp-epsilon = 0.0

# Privacy layer L4-central (docs/PRIVACY.md §3.1): clip + Gaussian-noise during AGGREGATION —
# protects the released model, not the wire (the server still receives un-noised updates; that
# channel is what secure-aggregation / local-dp address). The budget is the configured quantity:
# `central-dp-epsilon` is the composed RDP ε over ALL num-server-rounds at `central-dp-delta`,
# and dp.sigma_for_epsilon inverts the accountant to derive the per-run noise multiplier σ —
# so the reported number stays fixed while the round count changes (fewer rounds need less noise
# for the same ε). The live path then SCALES σ by K·ρ_max (census-derived largest update share):
# Flower noises the uniform average while FedAvg weights by num-examples, so the largest practice
# would otherwise receive an effectively smaller σ than credited (server_app._: central-DP block).
# Requires fraction-fit = 1.0 (client subsampling would break that correction). 0 = off.
# Mutually exclusive with secure-aggregation on this code path (server_app raises if both are set).
central-dp-epsilon = 0.0
central-dp-delta = 1e-5

# The deployment standard (notebooks/03): record-level DP-SGD inside each practice + the server-side
# ε orchestrator. Set >0 to a target composed ε; the ServerApp then runs a Phase-0 census and stamps
# each practice's (batch, σ) plan per round. Mutually exclusive with central-dp-epsilon; composes
# with secure-aggregation=true (the pair IS the standard).
dpsgd-epsilon = 0.0

# Privacy layer L3 (docs/PRIVACY.md §1): SecAgg+ — the server can open only the aggregate, never one
# practice's update. OFF by default because it switches the run onto the legacy workflow (flwr 1.33
# ships SecAgg+ only in the legacy namespace), which the protocol benchmark does not use.
# Enablement ENTIRELY from this run-config key: the ServerApp reads it (workflow selection) and
# broadcasts it; each SuperNode's dispatching mod (client_app._secagg_dispatch) reads the broadcast
# copy and joins the protocol. No node-side environment variable exists — nothing reads
# FLIPIT_SECAGG (an earlier draft comment claimed otherwise; deleted 2026-08 audit).
secure-aggregation = false
secagg-num-shares = 3                 # Shamir shares per practice
secagg-reconstruction-threshold = 2   # shares needed to recover a dropped practice's mask


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

# [tool.flwr.federations]
# default = "local-sim"

# [tool.flwr.federations.local-sim]
# options.num-supernodes = 12  # number of simulated practices (keep == num-practices)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Notebooks: sys.path bootstrap before imports (E402); compact one-line statements and grouped
# imports are idiomatic in a notebook setup cell (E702, E401).
"notebooks/*.ipynb" = ["E402", "E702", "E401"]
