[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ckd-fl"
version = "1.0.0"
description = "FLIP-IT pre-kickoff baseline: federated CKD risk models with Flower.ai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andy Tai" }]
keywords = ["federated-learning", "healthcare", "ckd", "flower"]

# Lightweight, torch-free stack: logistic regression + sklearn MLP + gradient-boosted trees.
# flwr pinned to the <1.20 line: federations live in this pyproject (self-contained / reproducible),
# and `flwr run` uses the classic, stable simulation engine. 1.30+ moves federation config into a
# user-global ~/.flwr/config.toml, which is not what we want for a shared research repo.
# Every model is Flower-federatable (project rule, CLAUDE.md §0): logreg/mlp via FedAvg, xgboost via
# FedXgbBagging — so xgboost is a core dependency, not an optional extra. (macOS needs OpenMP at
# runtime for xgboost: `brew install libomp`.)
dependencies = [
    "flwr[simulation]>=1.13,<1.20",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
# Everything needed to open and run notebooks/ in VS Code or Jupyter, plus headless execution.
notebook = [
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "nbconvert>=7.0.0",
    "jupyterlab>=4.0.0",
]

[project.scripts]
# Ray-free local federated simulation (works on paths with spaces). Run: uv run ckd-simulate
ckd-simulate = "simulate:main"
# Centralized "ceiling" baselines (non-federated reference). Run: uv run ckd-baseline --model xgboost
ckd-baseline = "centralized:main"
# Generate synthetic per-clinic datasets (the FLIP-IT federation). Run: uv run ckd-clinics
ckd-clinics = "data.synthesize:main"

# Flat layout: data/ and models/ packages plus top-level app modules at the repo root.
[tool.hatch.build.targets.wheel]
include = [
    "data", "models",
    "client_app.py", "server_app.py", "task.py", "centralized.py", "simulate.py",
]
# Editable installs: put the project root on sys.path (path-based) rather than enumerating
# modules, so every top-level .py here is importable and newly added files are picked up reliably.
dev-mode-dirs = ["."]

# ── Flower App configuration ────────────────────────────────────────────────
# Run the federated simulation with:  uv run flwr run .
[tool.flwr.app]
publisher = "andytai"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 20      # federation rounds
fraction-fit = 1.0          # fraction of practices training per round
local-epochs = 2            # local partial_fit passes per round
model = "logreg"            # flwr-run FedAvg app: logreg | mlp  (xgboost federates via FedXgbBagging
                            # in `ckd-simulate`; see CLAUDE.md §6)
num-practices = 12          # MUST equal options.num-supernodes below
alpha = 0.5                 # Dirichlet non-IID concentration (small=skewed, large=IID)
iid = false                 # set true for an IID even split
class-weight-balanced = true
seed = 42

[tool.flwr.federations]
default = "local-sim"

[tool.flwr.federations.local-sim]
options.num-supernodes = 12  # number of simulated practices (keep == num-practices)

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Notebooks: sys.path bootstrap before imports (E402); compact one-line statements are fine (E702).
"notebooks/*.ipynb" = ["E402", "E702"]
