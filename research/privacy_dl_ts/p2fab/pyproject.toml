[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secagg-ts"
version = "0.1.0"
description = "P2 measured row: SecAgg+ over the LSTM wire on 10 ECG clinics (local deployment)"
dependencies = [
    "flwr>=1.33.0",
    "torch>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["secagg_app"]

[tool.flwr.app]
publisher = "fl-ckd"

[tool.flwr.app.components]
serverapp = "secagg_app.server_app:app"
clientapp = "secagg_app.client_app:app"


